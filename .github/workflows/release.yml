name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 (.nvmrc) bundles npm 11 (>= 11.5.1), which npm trusted
          # publishing (OIDC) requires
          node-version-file: .nvmrc
          cache: pnpm
      - run: npm --version
      - run: pnpm install
      # Gate the release on the checks CI would run. The "chore: version
      # packages" PR is opened with GITHUB_TOKEN, which does not trigger the CI
      # workflow, and on merge this workflow runs in parallel with CI, so
      # without this step the only check before `npm publish` is
      # prepublishOnly (build, ES2015 check, dist tests): no type check and no
      # source tests
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Create GitHub Release (fallback)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="v$(jq -r '.version' package.json)"
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            CHANGELOG=$(sed -n "/^## ${VERSION#v}/,/^## /p" CHANGELOG.md | sed '1d;$d')
            gh release create "$VERSION" --title "$VERSION" --notes "$CHANGELOG" --target "$GITHUB_SHA"
            echo "Created GitHub release $VERSION"
          else
            echo "GitHub release $VERSION already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
