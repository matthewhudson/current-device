name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 (.nvmrc) bundles npm 11 (>= 11.5.1), which npm trusted
          # publishing (OIDC) requires
          node-version-file: .nvmrc
          cache: pnpm
      - run: npm --version
      - run: pnpm install
      # Gate the release on the checks CI would run. The "chore: version
      # packages" PR is opened with GITHUB_TOKEN, which does not trigger the CI
      # workflow, and on merge this workflow runs in parallel with CI, so
      # without this step the only check before `npm publish` is
      # prepublishOnly (build, ES2015 check, dist tests): no type check and no
      # source tests
      - run: pnpm run typecheck
      - run: pnpm run test
      # changesets/action v2 needs Changesets CLI 3 and renamed its inputs.
      #
      # The default GITHUB_TOKEN has two limits here: it cannot push a change
      # to .github/workflows/* (so the version PR can no longer be updated
      # once a workflow file changed on main, which is how release run #47
      # failed), and PRs it opens don't trigger the CI workflow. Set a
      # CHANGESETS_TOKEN repository secret (fine-grained PAT: Contents,
      # Pull requests and Workflows read/write on this repo) to lift both;
      # until then the default token is used
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Create GitHub Release (fallback)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="v$(jq -r '.version' package.json)"
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            CHANGELOG=$(sed -n "/^## ${VERSION#v}/,/^## /p" CHANGELOG.md | sed '1d;$d')
            gh release create "$VERSION" --title "$VERSION" --notes "$CHANGELOG" --target "$GITHUB_SHA"
            echo "Created GitHub release $VERSION"
          else
            echo "GitHub release $VERSION already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
